name: Update steam playtime

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 0 * * *"

jobs:
  build:
    name: Update-steam-playtime
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GH_TOKEN }}
      GIST_ID: 62fa160542e61ac240820bc0b02b5632
      STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
      STEAM_ID: ${{ secrets.STEAM_ID }}
      UPDATE_OPTION: GIST_AND_MARKDOWN
      MARKDOWN_FILE: README.md

    steps:
      - name: Set up Go 1.x
        uses: actions/setup-go@v2
        with:
          go-version: ^1.14
      - name: Check out repo
        uses: actions/checkout@v2

      - name: Run steam-box
        run: go run ./cmd/box/main.go

      - name: Commit and push
        run: |-
          git config --global user.email "bot@github.com"
          git config --global user.name "Steam-Bot"
          git add README.md && git commit -m ":memo: update profile" || exit 0
          git push https://x-access-token:${{ secrets.GH_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
